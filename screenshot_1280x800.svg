          <rect x="0" y="224" width="390" height="48" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="20" cy="248" r="8" stroke="#38bdf8" stroke-width="1.8" fill="none"/>

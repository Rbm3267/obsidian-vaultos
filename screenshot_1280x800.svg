          <rect x="0" y="56" width="390" height="48" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="20" cy="80" r="8" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
          <text x="38" y="80" fill="#f8fafc" font-size="12.5" font-weight="500">Implement retry backoff for telemetry WebSocket</text>
          <text x="38" y="94" fill="#64748b" font-size="10">Projects/Helios · 📅 2026-10-15</text>

          <rect x="0" y="112" width="390" height="48" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          <circle cx="20" cy="136" r="8" stroke="#38bdf8" stroke-width="1.8" fill="none"/>

    <rect x="56" y="96" width="24" height="24" rx="6" fill="rgba(56,189,248,0.15)"/>
    <path d="M62 108 L74 108 M68 102 L68 114" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="150" r="9" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <rect x="61" y="186" width="14" height="14" rx="3" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <path d="M62 232 L74 232 M62 236 L70 236 M62 240 L72 240" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>


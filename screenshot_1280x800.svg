        <text x="18" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="600" text-transform="uppercase" letter-spacing="0.05em">Total Notes</text>
        <text x="18" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800">1,248</text>

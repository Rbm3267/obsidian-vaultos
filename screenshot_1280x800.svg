    <rect x="40" y="30" width="1200" height="740" rx="16" fill="#090e1c" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect x="40" y="30" width="1200" height="42" rx="16" fill="#0d1428"/>
    <!-- Window Controls -->
    <circle cx="68" cy="51" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="88" cy="51" r="6" fill="#f59e0b" opacity="0.85"/>
    <circle cx="108" cy="51" r="6" fill="#10b981" opacity="0.85"/>
    <!-- Breadcrumb -->
    <text x="640" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Knowledge Vault · VaultOS Dashboard</text>

    <!-- Sidebar Mini Rail -->
    <rect x="40" y="72" width="56" height="698" fill="#070c18"/>
